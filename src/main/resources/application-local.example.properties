# Modelo da configuração local. Copie para "application-local.properties" (mesma pasta)
# e preencha. O arquivo application-local.properties é ignorado pelo Git.

spring.datasource.username=
spring.datasource.password=

# Usuários que podem gerar token (adicione outros com [1], [2]...)
auth.usuarios[0].email=
auth.usuarios[0].senha=

# Segredo da assinatura do JWT (HS256, mínimo 32 caracteres)
auth.jwt.segredo=
