# Modelo da configuração local. Copie para "application-local.properties" (mesma pasta)
# e preencha. O arquivo application-local.properties é ignorado pelo Git.

spring.datasource.username=
spring.datasource.password=

# Usuários que podem gerar token (adicione outros com [1], [2]...)
auth.usuarios[0].email=
auth.usuarios[0].senha=
# Permissões do QA Center (opcional): qa.view, qa.execute, qa.cancel, qa.reports.view, qa.configure
auth.usuarios[0].permissoes=

# Conta usada só pelo executor do QA Center (crie como mais um usuário, sem permissões qa)
auth.usuarios[1].email=
auth.usuarios[1].senha=

# Segredo da assinatura do JWT (HS256, mínimo 32 caracteres)
auth.jwt.segredo=

# QA Center: credenciais que o executor usa nos testes (as da conta acima)
qa.conta-teste.email=
qa.conta-teste.senha=
