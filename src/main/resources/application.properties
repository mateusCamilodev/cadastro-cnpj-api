spring.application.name=cadastro-cnpj-api

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:cadastrodb

# Cria as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra no console os SQLs executados (bom para estudar)
spring.jpa.show-sql=true

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Campo desconhecido no JSON (ex.: "ipr", que foi renomeado para "solicitacao") → 400
spring.jackson.deserialization.fail-on-unknown-properties=true

# Upload de arquivos (PDF do documento)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Tempos do fluxo da solicitação (aceita s = segundos, m = minutos)
solicitacao.tempo-recebido=10s
solicitacao.prazo-documento=5m
solicitacao.tempo-processamento=30s
# De quanto em quanto tempo o agendador roda (em milissegundos)
solicitacao.intervalo-agendador-ms=5000

# ===== QA Center =====
# Ambientes que o executor pode testar. Só estes endereços são chamados (nada vem do navegador).
# Desenvolvimento = a própria API; Homologação = uma segunda instância (ex.: mvnw spring-boot:run com --server.port=8099)
qa.ambientes.desenvolvimento.url=http://localhost:${server.port:8080}
qa.ambientes.homologacao.url=http://localhost:8099
# Limites: execuções ao mesmo tempo (total e por usuário), tempo máximo de cada requisição e de cada execução
qa.limites.simultaneas=2
qa.limites.por-usuario=1
qa.limites.timeout-requisicao=10s
qa.limites.timeout-execucao=10m
# A conta usada pelo executor para chamar a API (qa.conta-teste.email/senha) fica no application-local.properties

# Usuários, senhas e o segredo do JWT ficam em application-local.properties (fora do Git).
# Modelo: application-local.example.properties
# Validade do token
auth.jwt.expiracao=15m

spring.config.import=optional:classpath:application-local.properties
