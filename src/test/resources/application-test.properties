# Perfil "test": configuração própria dos testes automatizados (não depende do application-local.properties)
auth.jwt.segredo=segredo-exclusivo-dos-testes-automatizados-0123456789
auth.usuarios[0].email=qa-admin@teste.com
auth.usuarios[0].senha=senha-admin
auth.usuarios[0].permissoes=qa.view,qa.execute,qa.cancel,qa.reports.view,qa.configure
auth.usuarios[1].email=sem-permissao@teste.com
auth.usuarios[1].senha=senha-comum
auth.usuarios[2].email=executor@teste.com
auth.usuarios[2].senha=senha-executor
# Operador: vê e executa, mas não configura nem vê relatórios
auth.usuarios[3].email=operador@teste.com
auth.usuarios[3].senha=senha-operador
auth.usuarios[3].permissoes=qa.view,qa.execute

qa.conta-teste.email=executor@teste.com
qa.conta-teste.senha=senha-executor
# O executor chama a própria aplicação na porta aleatória do teste
qa.ambientes.desenvolvimento.url=http://localhost:${local.server.port}
qa.ambientes.homologacao.url=http://localhost:1

# Tempos curtos para os cenários de documento e de análise rodarem em segundos
solicitacao.tempo-recebido=1s
solicitacao.prazo-documento=2m
solicitacao.tempo-processamento=1s
solicitacao.intervalo-agendador-ms=300
spring.jpa.show-sql=false
